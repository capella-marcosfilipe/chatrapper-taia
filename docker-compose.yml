services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sabotage-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sabotage-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sabotage-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sabotage-net

networks:
  sabotage-net:
    driver: bridge
